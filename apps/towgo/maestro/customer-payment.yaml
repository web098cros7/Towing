# Track B Phase 19 — §9.1.9's payment, rebuilt as Figma 27 Payment, 28 Apply
# Coupon, 29 Payment Failed and 30 Payment Successful, plus the wallet.
#
# ⚠ NEVER EXECUTED. No EAS or dev-client build exists for this app, so no
# Maestro flow in this repo has ever run. Reviewed against the screens as
# written; that is all.
#
# Runs against `paymentsMockSource` (no backend, no gateway), the hermetic CI
# path Phase 12 established. Requires `EXPO_PUBLIC_USE_MOCKS` unset or `true`,
# and `EXPO_PUBLIC_MOCK_PAYMENT_STATE` / `EXPO_PUBLIC_MOCK_COUPON_STATE` unset.
#
# WHY IT CAN RUN AT ALL WITHOUT RAZORPAY. The mock intent returns
# `autoSettles: true`, which is the server's way of saying "there is no vendor
# here" — `openCheckout` then skips `react-native-razorpay` entirely and returns
# the server-supplied dev checkout result. That is the same branch every local
# run and the whole backend suite take, because no merchant account exists
# (SETUP-CHECKLIST item 12). It is ALSO the only branch that could ever run in
# Expo Go, where the native module does not exist.
#
# WHY 29 IS REACHABLE. The mock declines the FIRST Pay of each booking in a
# session and captures the next one, so one pass walks 27 → 29 → 27 → 30.
#
# WHAT IT PROVES:
#   · 20's Status card opens 27 for a completed, unpaid trip (the way back to
#     pay later);
#   · 27's Total and "Pay ₹…" are the amount being charged, and follow a coupon
#     applied on 28 (test mode only: the real server cannot apply one at
#     payment time);
#   · a decline shows 29 with the charged amount, the chosen method, the reason
#     and the booking reference, and "Use Another Method" returns to 27's list;
#   · a capture resets the stack to Home + 30, whose Back can only reach Home.
#
# WHAT IT CANNOT PROVE:
#   · the real Razorpay sheet — a native module, never built, never opened;
#   · that money moved — the mock settles itself, and the ledger assertions live
#     in `payments-capture.e2e.spec.ts` where a real Postgres can be inspected;
#   · the clipboard — Maestro cannot read it; the copy tap is only exercised.
#
# No `testID` convention exists in this repo. Every step below matches visible
# copy or an `accessibilityLabel` as text (Maestro's `id:` selects a testID,
# which this app never sets), as a full regex (see customer-login.yaml).

appId: in.mitow.customer
---
- runFlow: customer-login.yaml

# ── Reach a finished, unpaid trip ───────────────────────────────────────────
#
# The bookings list's fixtures include completed trips; opening one is cheaper
# and more reliable than driving a whole booking to completion. The first
# "Completed" card is fixture b1 (TW-B1000001, ₹1,250). The tab bar reads Home,
# Bookings, Support, Profile.
- tapOn: 'Bookings'
- assertVisible: 'My Bookings'

# A booking card is one accessible element labelled
# "<pickup> to <drop>, <status>, <fare>".
- tapOn: '.*Completed.*'

# A finished trip opens Figma 35 · Completed Trip Details (not 20): no pinned
# Cancel / Share bar, and its own Book Again / Download Receipt bar.
- assertVisible: 'Trip Completed'
- assertVisible: 'Driver Details'
- assertVisible: 'Payment Details'
- assertNotVisible: 'Cancel Booking'

# The fixture is completed but not paid yet, so 35's Payment Details row opens
# 27 Payment. It is one accessible element.
- tapOn: 'Payment details\. Pay for this trip'

# ── 27 Payment ──────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'Total amount, ₹1,250'
    timeout: 10000
- assertVisible: 'Choose Payment Method'
- assertVisible: 'UPI\. Pay using any UPI app'
- assertVisible: 'Apply Coupon'
- assertVisible: '100% Secure Payments.*'
- assertVisible: 'Pay ₹1,250'

# ── 28 Payment · Details Open (View Details expands the bill in place) ──────
- tapOn: 'View details'
- assertVisible: 'Base fare.*'
- assertVisible: 'Distance charge.*'
- tapOn: 'Hide details'
- assertVisible: 'View details'

# ── Apply Coupon sheet (test mode only: 27's Apply Coupon row opens it) ────
- tapOn: 'Apply Coupon'
- assertVisible: 'Apply coupon'
- assertVisible: 'Available offers'
- tapOn: 'Apply SAVE20'
# 20 % of ₹1,250, under the offer's ₹300 cap.
- extendedWaitUntil:
    visible: 'SAVE20 applied\. You save ₹250 on this trip\.'
    timeout: 10000
- assertVisible: 'SAVE20 applied'
- tapOn: 'Done'
# The intent is re-created with the coupon, so Total and Pay follow it.
- extendedWaitUntil:
    visible: 'Pay ₹1,000'
    timeout: 10000
- assertVisible: 'Total amount, ₹1,000'

# ── 29 Payment Failed (the mock declines the first attempt) ─────────────────
- tapOn: 'Pay ₹1,000'
- extendedWaitUntil:
    visible: 'Payment failed'
    timeout: 15000
- assertVisible: 'Your trip is safe'
- assertVisible: 'Amount, ₹1,000'
- assertVisible: 'Payment method, UPI'
- assertVisible: 'Reason, Declined by bank'
- assertVisible: 'Reference ID, TW-B1000001'
- assertVisible: 'Try Again'

# Back to 27's list, same session (the coupon is still applied).
- tapOn: 'Use Another Method'
- assertVisible: 'Choose Payment Method'
- tapOn: 'Credit / Debit Card\. Visa, Mastercard, RuPay'

# ── 30 Payment Successful ───────────────────────────────────────────────────
- tapOn: 'Pay ₹1,000'
- extendedWaitUntil:
    visible: 'Payment Successful!'
    timeout: 15000
- assertVisible: 'Your payment has been processed successfully\.'
# Each Summary Row is one accessible element, "<label>, <value>"; the copy button is its own.
- assertVisible: 'Payment Method, Credit / Debit Card'
- assertVisible: 'Transaction ID, pay_dev_mock_.*'
- assertVisible: 'Secure Payment'
- tapOn: 'Copy transaction ID'

# View Booking Details is pushed over 30, so its Back returns here.
- tapOn: 'View Booking Details'
- assertVisible: 'Booking Details'
- tapOn: 'Go back'
- assertVisible: 'Payment Successful!'

# 30's Back goes Home: the stack under it is only the tabs.
- tapOn: 'Go back'
- assertNotVisible: 'Payment Successful!'

# ── §9.1.9's wallet ────────────────────────────────────────────────────────
- tapOn: 'Profile'
# The redesigned Profile (Figma 38) lists Payment Methods as a menu row.
- tapOn: '.*Manage cards, UPI and wallets.*'

# The screen that showed a fictional "HDFC Visa •••• 4321" from a hardcoded
# fixture until Phase 19, with every row wired to `const notReady = () => {}`.
- assertVisible: '.*MiTow Wallet.*'
- assertVisible: '.*Saved by our payment partner.*'

- tapOn: '.*MiTow Wallet, refunds and credits.*'
- assertVisible: 'Available balance'
# The first NEGATIVE money this app ever rendered. `formatPaise(-25000)`
# produced "₹-,500" before this phase, on every engine, silently.
- assertVisible: '.*Reversed — booking refunded.*'
