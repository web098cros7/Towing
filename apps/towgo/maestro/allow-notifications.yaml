# Track B Phase 13 — accepting the push permission.
#
# Split out of `customer-login.yaml` because the OS prompt can be answered only
# ONCE per install: a single flow cannot both decline and accept, and the
# login flow declines so it stays deterministic.
#
# ⚠ OS-VERSION-SPECIFIC, and never executed. The Android 13+ runtime
# notification prompt says "Allow"; iOS says "Allow" too but under a different
# system dialog. Both branches are conditional so the flow does not fail on the
# platform that shows the other one — the same shape `pick-one-photo.yaml`
# already uses for the media-library prompt.
appId: in.mitow.customer
---
- launchApp:
    clearState: true

# Same login steps as customer-login.yaml, kept in sync with the MiTow redesign:
# Welcome (02) → Login (03) → Verify OTP (04) → Profile Setup (05) → consent
# (06). See that file for why the multi-line markers end in `.*`.
- assertVisible: 'Reliable Towing.*'
- tapOn: "Log In"
- assertVisible: "Welcome Back!"
- tapOn: "Enter your mobile number"
- inputText: "9876543210"
- tapOn: "Continue"
- assertVisible: "Enter the code"
- tapOn: "One-time code"
- inputText: "000000"

- assertVisible: 'What should we.*'
- tapOn: "Enter your full name"
- inputText: "Rahul Sharma"
- hideKeyboard
- tapOn: "Continue"

- assertVisible: "Before you continue"
- tapOn: "I Agree"

# The priming sheet (07) — our own screen, not the OS. It slides over Home a
# moment after the consent overlay closes.
- assertVisible: "Know when your driver arrives"
- tapOn: "Turn on notifications"

# The OS prompt, which the sheet triggers.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- assertVisible: 'Fast Towing,.*'
