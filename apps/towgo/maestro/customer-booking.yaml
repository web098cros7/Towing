# Track B Phase 15 — book a tow, end to end, hermetic.
#
# Runs against `bookingsMockSource` and `pricingMockSource` (no backend), the
# same "mocks-on Maestro flows retained as hermetic CI path" rule Phase 12
# established. Requires `EXPO_PUBLIC_USE_MOCKS` unset or `true`.
#
# What it proves — the §9.1.5 flow Phase 15 made real:
#   home → location → tow type → an estimate lands → the fare breakdown opens
#   (its ⓘ was inert until Phase 14) → Confirm creates a booking (it was a bare
#   `navigation.navigate('Searching')` until Phase 15) → the searching screen is
#   reached for a booking that actually exists → the trip survives leaving that
#   screen, via an active-trip card that did not exist at all before.
#
# The booking is still SEARCHING when the flow reaches the bookings list, and
# the flow then cancels it from Booking Details (20) through Cancel Trip (21).
# The mock search runs a timeline (see `bookingsMockSource.ts`): a new booking's
# search widens wave by wave and reads back as `no_drivers_found` (17) after
# 30 s, and only a retried search is matched (18). `customer-tracking.yaml`
# walks that path; this flow has to reach the bookings list and the cancel
# inside those 30 s, while the booking is still live.
#
# Matches on visible copy and accessibilityLabel only — this codebase has no
# testID convention (see customer-login.yaml, which also explains the `.*`).
#
# ⚠ NEVER EXECUTED. No EAS or dev-client build exists for this app, so no
# Maestro flow in this repo has ever run. Reviewed against the screens as
# written; that is all.
appId: in.mitow.customer
---
- runFlow: customer-login.yaml

# ── Step 1: open the booking flow from Home ─────────────────────────────────
- assertVisible: 'Fast Towing,.*'
# The redesigned Home (08) still shows "Where do you need a tow?", but as the
# sheet's HEADING rather than a control — tapping it does nothing now. The CTA
# directly beneath it is what opens this step.
- tapOn: 'Book a Tow'
- assertVisible: 'Enter Location'

# ── Step 2: pickup and drop, both carrying real coordinates ─────────────────
# Enter Location (10) draws no suggestions list, so a Saved & Recent row is
# still the surest source of a coordinate: typed text only resolves to a place
# once editing ends. Pickup already holds the mock default ("MG Road,
# Bengaluru").
#
# "Drop Location" is both the field's visible label and its input's
# accessibilityLabel. Focusing it makes the next row tap fill Drop; the keyboard
# then has to go, or it covers the rows.
- tapOn: 'Drop Location'
- hideKeyboard
# A recent row, tapped by its accessibilityLabel ("<title>. <subtitle>").
# Koramangala is no longer a recent row: 10 draws "Kempegowda Intl. Airport"
# and "HSR Layout", and the airport lies outside the seeded service zone.
- tapOn: 'HSR Layout. Sector 2, HSR Layout, Bengaluru'

# §9.1.5's schedule pill — `onPress={() => {}}` until Phase 15, so `'later'`
# was unreachable and this sheet did not exist. Sheet 11's preset rows are
# labelled "<title>. <subtitle>" too.
- tapOn: 'Pickup now'
- assertVisible: 'When do you need the tow?'
- tapOn: 'Now. Nearest available tow truck'
# Figma 11 added a Done button. Tapping a row now only MOVES the selection, so
# the choice has to be committed here — previously the row tap did both.
- tapOn: 'Done'

- tapOn: 'Continue'

# ── Step 3: the fare estimate ───────────────────────────────────────────────
- assertVisible: 'Select Vehicle'
# Book a Tow (14) never disables a control. The Estimated Fare row opens the
# breakdown once a quote is on screen and asks for one again otherwise, so the
# breakdown sheet (15) opening is the sync point for an estimate having landed.
- tapOn: 'View fare breakdown'
- extendedWaitUntil:
    visible: 'Fare breakdown'
    timeout: 10000
- assertVisible: 'Base fare'
- assertVisible: 'Total estimate'
- assertVisible: 'Fare locks when you confirm. Until then it may change with demand, tolls or waiting time.'
- tapOn: 'Got It'

# A note the driver will see. `setNote` was never called from anywhere before.
# Figma 14 draws the notes field as the input itself: the note is typed in
# place (no sheet, no Save) and stays on screen as the field's value.
- tapOn: 'Additional notes'
- inputText: 'Blue hatchback, basement parking'
- hideKeyboard
- assertVisible: 'Blue hatchback, basement parking'

# ── Step 4: confirm — the real POST ─────────────────────────────────────────
- tapOn: 'Confirm Booking'

# §9.1.6. The booking now exists and sits in SEARCHING (16).
- extendedWaitUntil:
    visible: 'Searching for Tow'
    timeout: 15000
# The banner TITLE, not its subtitle: Figma 16 makes the subtitle report the live
# search radius and driver count, which the mock search widens every 10 s, so it
# is not a fixed string.
- assertVisible: 'Hang tight!'

# ── Step 5: the trip survives leaving the screen ────────────────────────────
# THE POINT OF THE ACTIVE-TRIP CARD. Leaving the search used to lose the trip
# entirely — nothing outside the tracking screen knew one was running.
#
# This leaves WITHOUT cancelling: "Cancel Request" would end the booking, which
# is the opposite of what this step proves. Figma 16 draws no back control
# (only Help and Cancel Request) and the screen turns the iOS back swipe off, so
# the way out is Android's system back — THIS STEP IS ANDROID-ONLY. Confirm
# REPLACED Book a Tow with the search, so back lands on Enter Location, then on
# Home.
- pressKey: back
- assertVisible: 'Enter Location'
- pressKey: back
- assertVisible: 'Fast Towing,.*'

- tapOn: 'Bookings'
- assertVisible: 'My Bookings'
# 33's Booking Cards carry one accessibility label, "<service>, <route>, <date>, <price>",
# with an arrow (U+2192) between the two place labels. The service comes from the booking's
# slug; the card this flow just made reports `car_tow` (see `MOCK_CREATED_SERVICE_SLUG`),
# so it reads "Tow a Car" whether the search is live or has lapsed.
- assertVisible: 'Tow a Car, MG Road, Bengaluru.*Koramangala, Bengaluru.*'

# ── Cleanup: cancel from Booking Details (20) through Cancel Trip (21) ──────
# The card opens Booking Details, which now pins "Cancel Booking" for every live status,
# searching included. Cancelling here also keeps a real backend's §3.8
# one-active-booking guard (`active_booking_exists`) clear for the next run.
#
# TIMING: this must still land inside the mock search's 30 s. Once the search
# lapses to `no_drivers_found` the booking is no longer live and 20 hides its
# bottom bar, so "Cancel Booking" would not be there to tap.
- tapOn: 'Tow a Car, MG Road, Bengaluru.*'
- assertVisible: 'Booking Details'
# The status card is one accessible element: "<title>. <subtitle>. Open live tracking".
- assertVisible: 'Booking Confirmed. Finding you a driver.*'
- tapOn: 'Cancel Booking'
# Selectors are regexes, so the "?" and the parentheses are escaped.
- assertVisible: 'Cancel this trip\?'
- assertVisible: 'Tell us why \(optional\)'
# Single-select and optional; the label is sent verbatim as the cancel reason.
- tapOn: 'Changed my plans'
- tapOn: 'Yes, Cancel Trip'
# A successful cancel goes Home.
- extendedWaitUntil:
    visible: 'Fast Towing,.*'
    timeout: 10000
