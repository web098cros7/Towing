# Track B Phase 18 — live tracking, the share link, and the honest states.
#
# Runs against `trackingMockSource` (no backend), the hermetic CI path Phase 12
# established. Requires `EXPO_PUBLIC_USE_MOCKS` unset or `true`, and
# `EXPO_PUBLIC_MOCK_TRACKING_STATE` unset (its `error` state never reports a
# status, so the trip could not move on).
#
# WHY THE MOCK MOVES. `trackingMockSource` walks the driver along a fixed
# approach path and reports a bearing between each pair of points. A static
# fixture would make §11.4's interpolation, the bearing marker, the pan-pause
# and the ETA countdown all unreachable without a device and a real driver —
# which, given no dev-client build exists, means unreachable full stop.
#
# THE MOCK TRIP CLOCK. Once the mock driver accepts, one shared clock
# (`mockTripClock.ts`) moves the trip on, and the booking and the tracking
# mocks both read it:
#   about 15 s `assigned`    → 18 Driver En Route
#   about 45 s `en_route`    → 19 Driver Arriving (the truck walks to the pickup)
#   then `arrived`, held     → 23 Driver Arrived → Confirm Pickup → 24 Collection Code
#   12 s after 24 FIRST shows its code (the mock driver "types it"):
#   about 70 s `in_progress` → 25 Trip in Progress (10 s loading, then the tow)
#   then `completed`, held   → 27 Payment (Tracking is replaced by it)
#
# What it proves — everything the Phase 12 screen faked:
#   the tracking screen shows a REAL driver (it showed `assignedDriverMock` —
#   the same "Ramesh Kumar / KA 03 AB 1234" for every trip) → an ETA that counts
#   down → the trip moving through 18, 19 and 23 on its own → the collection
#   OTP on 24, from `useBookingOtp` → Back from 24 landing on 23, not Home →
#   the tow starting (25) → the finished trip handing over to 27 Payment.
#
# Share, the full timeline and cancel are no longer on these screens: the MiTow
# redesign moved them to 20 Booking Details (the vehicle card). See "Moved off
# these screens" below.
#
# WHAT IT CANNOT PROVE, and why the map assertions below are absent: the map is
# `react-native-maps`, a native module. Under mocks-on with no Google key the
# facade renders `MapPreviewPlaceholder`, so there is no marker to assert on and
# asserting the placeholder would test the fallback rather than the feature.
# That includes every map callout and chip ("Your tow truck / is on the way",
# "On the way to / your location", "Driver has arrived", "Your location",
# "Rakesh is here", "On the way to / drop location"). The interpolation and the pan-pause are covered by the
# shared maths' unit tests; the drawing is not covered at all.
#
# Matches on visible copy and accessibilityLabel only — no testID convention
# (see customer-login.yaml, which also explains the `.*`).
#
# ⚠ NEVER EXECUTED. No EAS or dev-client build exists for this app, so no
# Maestro flow in this repo has ever run. Reviewed against the screens as
# written; that is all.
appId: in.mitow.customer
---
- runFlow: customer-login.yaml

# ── Reach a trip that is in flight ──────────────────────────────────────────
# The old route here (`customer-booking.yaml`, then the active-trip card) no
# longer reaches this screen: that card opens Booking Details. In mock mode the
# way onto 18 is the mock search timeline (see `bookingsMockSource.ts`): a new
# search reads back as No Drivers Found (17) after 30 s, Try Again restarts it,
# and the retried search is accepted 12 s later, which hands off to 18. The
# search screen polls every 10 s, so each wait allows for a missed poll.
#
# The booking steps are the minimum from `customer-booking.yaml` (see there for
# why each selector is what it is).
- tapOn: 'Book a Tow'
- assertVisible: 'Enter Location'
- tapOn: 'Drop Location'
- hideKeyboard
- tapOn: 'HSR Layout. Sector 2, HSR Layout, Bengaluru'
- tapOn: 'Continue'
- assertVisible: 'Select Vehicle'
- tapOn: 'Confirm Booking'
- extendedWaitUntil:
    visible: 'Searching for Tow'
    timeout: 15000
- extendedWaitUntil:
    visible: 'No drivers found'
    timeout: 60000
- tapOn: 'Try Again'
- extendedWaitUntil:
    visible: 'Rakesh Kumar'
    timeout: 45000

# ── 18 Driver En Route (`assigned`, about 15 s) ─────────────────────────────
# §9.1.7: a REAL driver, not the frozen fixture. The driver comes from
# `trackingMockSource` (Figma 18's example driver). The deleted
# `assignedDriverMock` was "Ramesh Kumar": if this screen ever shows that name
# again, the frozen fixture has come back.
#
# 18 is on screen for only about 15 s after the match, so the checks here are
# the few that tell 18 apart; the driver row and vehicle card are checked on 19.
#
# §11.4's ETA: Figma 18 makes it the heading ("Arriving in 5 mins") over the
# state. The heading block is one accessible element labelled
# "<title>. <subtitle>", hence the `.*`.
- assertVisible: 'Arriving in \d+ mins.*'
- assertVisible: '.*Your driver is on the way to your location'
- assertNotVisible: 'Ramesh Kumar'

# ── 19 Driver Arriving (`en_route`, about 45 s) ─────────────────────────────
# The heading is static copy, one accessible element "<title>. <subtitle>".
- extendedWaitUntil:
    visible: 'Trip in Progress\. Your tow truck is on the way to your location'
    timeout: 30000
- assertVisible: 'Rakesh Kumar'
- assertVisible: '4.8 \(500\+ trips\)'
# Plate and model sit inside the vehicle card, one accessible element labelled
# "Tow truck, <plate>, <model>. View booking details".
- assertVisible: '.*KA 01 AB 1234.*'
- assertVisible: '.*Tata 407 \(Flatbed\).*'
# The arrival timeline: each row is one accessible element, "<title>, <time>,
# <state> step". The times are clock times, so they are matched by shape.
- assertVisible: 'Driver on the way, \d{1,2}:\d{2} (AM|PM), current step'
- assertVisible: 'Arriving at your location, Est\. \d{1,2}:\d{2} (AM|PM), upcoming step'
- assertVisible: 'Call driver'
- assertVisible: 'Message driver'
- assertVisible: "You're in safe hands"
- assertVisible: 'All our drivers are verified and insured.'

# ── The trip is still there ─────────────────────────────────────────────────
# Help opens 58 Support over the trip (its banner is one accessible element,
# "We're here to help! <subtitle>"). Backing out must land on the same live
# trip, not on Home.
- tapOn: 'Help'
- assertVisible: "We're here to help!.*"
- tapOn: 'Go back'
- assertVisible: 'Rakesh Kumar'

# ── 23 Driver Arrived (`arrived`, held) ─────────────────────────────────────
- extendedWaitUntil:
    visible: 'Driver has arrived\. Your driver is at the pickup location'
    timeout: 70000
- assertVisible: 'Verified Driver & Vehicle'
- assertVisible: 'All our drivers are background verified.'
- assertVisible: '.*KA 01 AB 1234.*'
- assertNotVisible: 'Your collection code.*'

# ── 24 Collection Code ──────────────────────────────────────────────────────
# Confirm Pickup calls no API; it opens 24 on the same screen. The code card is
# one accessible element, "Your collection code is <digits spaced>. <note>";
# the mock code is Figma 24's example, 4 8 2 7 1 9.
- tapOn: 'Confirm Pickup'
- assertVisible: '.*Share this code so Rakesh can start your tow\.'
- extendedWaitUntil:
    visible: 'Your collection code is 4 8 2 7 1 9\..*'
    timeout: 10000
- assertNotVisible: 'Confirm Pickup'

# Back on 24 returns to 23 (the in-screen step), not out of the trip.
- tapOn: 'Go back'
- assertVisible: 'Driver has arrived\. Your driver is at the pickup location'
- assertVisible: 'Confirm Pickup'

# ── 25 Trip in Progress (`in_progress`, about 70 s) ──────────────────────────
# The tow starts 12 s after 24 FIRST showed its code (above), whichever of 23
# and 24 is up by then. Open 24 again if 23 is still up, so the flow walks
# 24 → 25 as a customer would; if the tow has already started, 25 replaces 23.
- runFlow:
    when:
      visible: 'Confirm Pickup'
    commands:
      - tapOn: 'Confirm Pickup'
- extendedWaitUntil:
    visible: 'Trip in Progress\. Your vehicle is being towed to the drop location'
    timeout: 30000
- assertNotVisible: 'Your collection code.*'
# The trip timeline: each row is one accessible element, "<title>, <subtitle>,
# <time>, <state> step". "In transit" has no time for its first 10 s (the truck
# is loading), so its time is not matched; the other times are clock times,
# matched by shape.
- assertVisible: 'Picked up, .*\d{1,2}:\d{2} (AM|PM), completed step'
- assertVisible: 'In transit, On the way to .*current step'
- assertVisible: 'Drop at, .*Est\. \d{1,2}:\d{2} (AM|PM), upcoming step'
# The ETA banner is one accessible element, "<title>. <subtitle>".
- assertVisible: 'Estimated arrival in \d+ mins\. We''ll keep you updated\.'
# Not drawn on 25: the driver row, the vehicle card and the banners of 18–23.
- assertNotVisible: 'Rakesh Kumar'
- assertNotVisible: "You're in safe hands"

# ── 27 Payment (`completed`) ──────────────────────────────────────────────────
# The finished trip hands over to 27, which replaces the tracking screen.
- extendedWaitUntil:
    visible: 'Choose Payment Method'
    timeout: 100000

# ── Moved off these screens: full timeline, share, cancel ───────────────────
# Figma 18, 19, 23, 24 and 25 draw none of them; they are on 20 Booking
# Details, opened by the vehicle card on 18, 19 and 23. Their steps (the
# "Driver assigned / On the way / Arrived at pickup" timeline, "Share trip" →
# "Stop sharing", and the cancel fee quote with "Keep my trip") belong to the
# Booking Details flow. The pre-redesign sheet that still carries them is kept
# only for a re-dispatch or a dispute, which the mock trip clock never reaches.
