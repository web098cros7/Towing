version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.1.2 --activate
            - pnpm config set store-dir /root/.pnpm-store
            - echo "node-linker=hoisted" >> .npmrc
            - echo "public-hoist-pattern[]=*" >> .npmrc
            - pnpm install
        build:
          commands:
            - pnpm --filter towfleet-web build
            # Official AWS Amplify FAQ Fix for PNPM Workspaces:
            - rsync -a node_modules/ apps/towfleet-web/node_modules/
      artifacts:
        baseDirectory: apps/towfleet-web/.next
        files:
          - '**/*'
      cache:
        paths:
          - /root/.pnpm-store/**
          - apps/towfleet-web/.next/cache/**/*
