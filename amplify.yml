version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.1.2 --activate
            - pnpm config set store-dir /root/.pnpm-store
            # Crucial: This forces pnpm to place 'next' where Amplify expects it!
            - echo "public-hoist-pattern[]=*next*" >> .npmrc
            - echo "public-hoist-pattern[]=*react*" >> .npmrc
            - pnpm install
        build:
          commands:
            - pnpm --filter towfleet-web build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - /root/.pnpm-store/**
          - .next/cache/**/*
    appRoot: apps/towfleet-web
