version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.1.2 --activate
            - pnpm config set store-dir /root/.pnpm-store
            - pnpm install
        build:
          commands:
            - pnpm --filter towfleet-web build
            # Only copy the 'next' dependency to satisfy Amplify's version checker!
            # Do NOT copy the whole node_modules to avoid the 30-minute zip timeout.
            - mkdir -p ./node_modules
            - cp -R ../../node_modules/next ./node_modules/
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - /root/.pnpm-store/**
          - .next/cache/**/*
    appRoot: apps/towfleet-web
