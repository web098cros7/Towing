version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.1.2 --activate
            - pnpm config set store-dir /root/.pnpm-store
            - pnpm install
        build:
          commands:
            - pnpm --filter towfleet-web build
            # Foolproof method to bypass Amplify's Next.js version checker in PNPM monorepos
            # Download a fresh physical copy of next just for Amplify to read!
            - mkdir -p ./temp_deps && cd ./temp_deps && npm init -y && npm install next@15.5.22 react react-dom && cd ..
            - mkdir -p ./node_modules
            - cp -R ./temp_deps/node_modules/next ./node_modules/
            - rm -rf ./temp_deps
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - /root/.pnpm-store/**
          - .next/cache/**/*
    appRoot: apps/towfleet-web
