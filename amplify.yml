version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.1.2 --activate
            - pnpm config set store-dir /root/.pnpm-store
            - pnpm install --frozen-lockfile
        build:
          commands:
            # Give the Next.js build process 6 GB of heap (the container has 8 GB).
            # The standalone tracer walks the full dependency graph; without this
            # the default ~2 GB Node heap exhausts during "Collecting build traces".
            - export NODE_OPTIONS="--max-old-space-size=6144"
            - pnpm --filter towfleet-web build
      artifacts:
        baseDirectory: apps/towfleet-web/.next
        files:
          - '**/*'
      cache:
        paths:
          - /root/.pnpm-store/**
          - apps/towfleet-web/.next/cache/**/*
