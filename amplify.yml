version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.1.2 --activate
            - pnpm config set store-dir /root/.pnpm-store
            - pnpm install
        build:
          commands:
            - pnpm --filter towfleet-web build
            # Fix HTTP 500: The Lambda crashed because it was missing runtime dependencies (lucide-react, etc).
            # Generate a pruned node_modules containing ALL production dependencies, then put it where Amplify expects it.
            - pnpm deploy --filter towfleet-web --prod --legacy ./temp_deploy
            - rm -rf ./node_modules
            - mv ./temp_deploy/node_modules ./node_modules/
            - rm -rf ./temp_deploy
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - /root/.pnpm-store/**
          - .next/cache/**/*
    appRoot: apps/towfleet-web
