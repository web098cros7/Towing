version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.1.2 --activate
            - pnpm config set store-dir /root/.pnpm-store
            # Force PNPM to put real folders at the root instead of hidden symlinks!
            - echo "node-linker=hoisted" > ../../.npmrc
            - pnpm install
        build:
          commands:
            - pnpm --filter towfleet-web build
            # Now that it's a real folder, this will copy successfully in 1 second!
            - mkdir -p ./node_modules
            - cp -R ../../node_modules/next ./node_modules/
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - /root/.pnpm-store/**
          - .next/cache/**/*
    appRoot: apps/towfleet-web
