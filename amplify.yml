version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.1.2 --activate
            - pnpm config set store-dir /root/.pnpm-store
            - pnpm install
        build:
          commands:
            - pnpm --filter towfleet-web build
            # Fix OOM error during pnpm deploy by allocating 6GB to Node's heap limit
            - export NODE_OPTIONS="--max-old-space-size=6144"
            - pnpm deploy --filter towfleet-web --prod --legacy ./temp_deploy
            - rm -rf ./node_modules
            - mv ./temp_deploy/node_modules ./node_modules/
            - rm -rf ./temp_deploy
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - /root/.pnpm-store/**
          - .next/cache/**/*
    appRoot: apps/towfleet-web
